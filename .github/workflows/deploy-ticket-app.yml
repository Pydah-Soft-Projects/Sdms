name: Deploy Ticket App to AWS Lightsail

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ticket-app/**'
      - 'ticket-backend/**'
      - '.github/workflows/deploy-ticket-app.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PM2_APP_NAME: maintenance-backend

jobs:
  build-ticket-frontend:
    name: Build Ticket Frontend (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ticket-app/package-lock.json

      - name: Install & build
        working-directory: ticket-app
        env:
          VITE_API_URL: /api
          VITE_MAIN_APP_URL: https://sdms.pydah.edu.in
          VITE_HRMS_PORTAL_URL: https://hrms.pydah.edu.in
          VITE_TICKET_APP_URL: https://maintenance.pydah.edu.in
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Pack dist
        run: tar -czf ticket-dist.tar.gz -C ticket-app dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket-dist
          path: ticket-dist.tar.gz
          retention-days: 1

  deploy-ticket-app:
    name: Deploy Ticket App to Lightsail
    needs: build-ticket-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: ticket-dist

      - name: Upload dist archive to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_TICKET_HOST || secrets.LIGHTSAIL_HOST || secrets.SERVER_IP || secrets.HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          source: ticket-dist.tar.gz
          target: /tmp/

      - name: Deploy backend + frontend on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_TICKET_HOST || secrets.LIGHTSAIL_HOST || secrets.SERVER_IP || secrets.HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            if [ -d "/home/ec2-user/Student-Data-Management-Application" ]; then
              APP="/home/ec2-user/Student-Data-Management-Application"
            elif [ -d "/home/ec2-user/Sdms" ]; then
              APP="/home/ec2-user/Sdms"
            else
              echo "Error: Application directory not found in /home/ec2-user"
              exit 1
            fi

            PM2_APP="${{ env.PM2_APP_NAME }}"

            echo "==> Pull latest code"
            cd "$APP"
            git fetch origin
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main

            echo "==> Deploy ticket frontend dist"
            sudo mkdir -p /var/www/ticket-app
            sudo rm -rf /tmp/ticket-app-dist
            sudo mkdir -p /tmp/ticket-app-dist
            sudo tar -xzf /tmp/ticket-dist.tar.gz -C /tmp/ticket-app-dist
            sudo rsync -a --delete /tmp/ticket-app-dist/dist/ /var/www/ticket-app/
            sudo rm -rf /tmp/ticket-app-dist /tmp/ticket-dist.tar.gz
            sudo chmod -R 755 /var/www/ticket-app

            cd "$APP/ticket-app"
            if [ -d dist ]; then
              mv dist "dist.old.$(date +%Y%m%d%H%M%S)"
            fi
            sudo cp -r /var/www/ticket-app "$APP/ticket-app/dist" 2>/dev/null || true
            chmod -R 755 "$APP/ticket-app/dist" 2>/dev/null || true

            echo "==> Ticket Backend install"
            cd "$APP/ticket-backend"
            npm ci --omit=dev

            echo "==> Database migrations"
            node migrations/migrate.js || true

            echo "==> PM2 restart ($PM2_APP)"
            sleep 5
            pm2 delete ticket-backend 2>/dev/null || true
            pm2 delete sdbms-ticket 2>/dev/null || true
            if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
              pm2 restart ecosystem.config.js --only "$PM2_APP" --update-env || pm2 restart "$PM2_APP" --update-env
            else
              pm2 start ecosystem.config.js --only "$PM2_APP" --update-env
            fi
            pm2 save

            echo "==> Nginx reload"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "==> Health check (wait until Node is listening)"
            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:5001/health >/dev/null 2>&1; then
                HEALTH_OK=1
                echo "Ticket backend healthy on attempt $i"
                break
              fi
              echo "Health attempt $i/30 — waiting for :5001 ..."
              sleep 2
            done

            if [ "$HEALTH_OK" != "1" ]; then
              echo "Ticket backend did not become healthy on 127.0.0.1:5001"
              pm2 list || true
              pm2 describe "$PM2_APP" || true
              pm2 logs "$PM2_APP" --lines 80 --nostream || true
              ss -lntp | grep -E '5001|node' || true
              exit 1
            fi

            curl -fsS http://127.0.0.1:5001/health
            echo
            curl -fsS http://127.0.0.1/health -H 'Host: maintenance.pydah.edu.in' || true
            echo
            pm2 list

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_TICKET_HOST || secrets.LIGHTSAIL_HOST || secrets.SERVER_IP || secrets.HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          script: |
            set -e
            PM2_APP="${{ env.PM2_APP_NAME }}"
            if ! pm2 list | grep -q "$PM2_APP.*online"; then
              echo "Ticket backend not online"
              pm2 logs "$PM2_APP" --lines 80 --nostream
              exit 1
            fi
            curl -fsS --max-time 5 http://127.0.0.1:5001/health >/dev/null
            echo "Ticket App deployment verified"
